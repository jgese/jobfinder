name: Collect jobs

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (GitHub may start it late)
  workflow_dispatch:       # adds a "Run workflow" button
  push:
    branches: [main]
    paths: ['site/**', 'collector/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write   # save the job index to the "data" branch
  pages: write      # publish the site
  id-token: write   # required by GitHub Pages
  models: read      # free AI tagging through GitHub Models

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the previous index
        run: |
          mkdir -p .state
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C .state
            echo "Restored $(ls .state | wc -l) files from the data branch."
          else
            echo "No data branch yet; starting fresh."
          fi

      - name: Collect
        run: node collector/collect.mjs --in .state --out out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Save the index to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git add -A
          git -c user.name="jobfinder-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Job index $(date -u +%FT%TZ)"
          # One commit, replaced each run, so the repo never grows.
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp out/jobs.json _site/data/jobs.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
